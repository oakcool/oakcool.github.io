name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version 13.6.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          aspire --version
      - run: npm ci
      - run: npm run test:artifact
      - run: npm run test:deployment
      - run: npm run build:css
      - run: dotnet restore OakIdeas.Github.Website.slnx --locked-mode
      - run: dotnet test OakIdeas.Github.Website.slnx --configuration Release --no-restore
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: dotnet publish src/OakIdeas.Github.Website.Client/OakIdeas.Github.Website.Client.csproj --configuration Release --no-restore --output artifacts/site
      - name: Add deterministic deployment revision marker
        run: printf '%s\n' "$GITHUB_SHA" > artifacts/site/wwwroot/deployment-revision.txt
      - run: npm run check:artifact -- artifacts/site/wwwroot
      - name: Test the published static site in Playwright
        run: npm run test:e2e
        env:
          E2E_TARGET: production
      - name: Smoke-test the published static files over HTTP
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory artifacts/site/wwwroot >/tmp/oakideas-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/CNAME | grep -Fx www.oakideas.com
          curl --fail --silent --show-error http://127.0.0.1:8765/menu.json >/dev/null
          runtime_path=$(grep -oE 'src="_framework/blazor\.webassembly[^"]+\.js"' artifacts/site/wwwroot/index.html | sed -E 's/^src="([^"]+)"$/\1/')
          test -n "$runtime_path"
          dotnet_assets=$(node --input-type=module -e '
          import { readFile } from "node:fs/promises";
          import { parseDotnetResourceMetadata } from "./scripts/dotnet-resource-metadata.mjs";
          const wwwroot = "artifacts/site/wwwroot/";
          const html = await readFile(`${wwwroot}index.html`, "utf8");
          const importMapMatch = html.match(/<script\s+type="importmap">([\s\S]*?)<\/script>/i);
          if (!importMapMatch) throw new Error("Published root is missing the .NET import map.");
          const importMap = JSON.parse(importMapMatch[1]);
          const loaderPath = importMap.imports?.["./_framework/dotnet.js"];
          if (typeof loaderPath !== "string" || !loaderPath.startsWith("./_framework/")) {
            throw new Error("Published import map does not identify the .NET loader.");
          }
          const metadata = parseDotnetResourceMetadata(await readFile(`${wwwroot}${loaderPath.slice(2)}`, "utf8"));
          console.log(loaderPath.slice(2));
          console.log(`_framework/${metadata.nativeRuntime}`);
          console.log(`_framework/${metadata.mainAssembly}`);
          ')
          mapfile -t dotnet_assets <<< "$dotnet_assets"
          test "${#dotnet_assets[@]}" -eq 3
          for asset_path in "$runtime_path" "${dotnet_assets[@]}"; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$asset_path" >/dev/null
          done
          test "$(curl --fail --silent --show-error http://127.0.0.1:8765/deployment-revision.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: artifacts/site/wwwroot

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-production:
    if: github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Smoke-test the deployed custom domain
        run: node scripts/smoke-production.mjs
        env:
          EXPECTED_DEPLOYMENT_REVISION: ${{ github.sha }}
