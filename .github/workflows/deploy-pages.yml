name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version 13.6.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          aspire --version
      - run: npm ci
      - run: npm run test:artifact
      - run: npm run build:css
      - run: dotnet restore OakIdeas.Github.Website.slnx --locked-mode
      - run: dotnet test OakIdeas.Github.Website.slnx --configuration Release --no-restore
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: dotnet publish src/OakIdeas.Github.Website.Client/OakIdeas.Github.Website.Client.csproj --configuration Release --no-restore --output artifacts/site
      - run: npm run check:artifact -- artifacts/site/wwwroot
      - name: Test the published static site in Playwright
        run: npm run test:e2e
        env:
          E2E_TARGET: production
      - name: Smoke-test the published static files over HTTP
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory artifacts/site/wwwroot >/tmp/oakideas-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/CNAME | grep -Fx www.oakideas.com
          curl --fail --silent http://127.0.0.1:8765/menu.json >/dev/null
          runtime_path=$(grep -oE 'src="_framework/blazor\.webassembly[^"]+\.js"' artifacts/site/wwwroot/index.html | sed -E 's/^src="([^"]+)"$/\1/')
          test -n "$runtime_path"
          curl --fail --silent "http://127.0.0.1:8765/$runtime_path" >/dev/null
          wasm_path=$(find artifacts/site/wwwroot/_framework -maxdepth 1 -name 'System.Private.CoreLib.*.wasm' -printf '%f\n' | head -n 1)
          test -n "$wasm_path"
          curl --fail --silent "http://127.0.0.1:8765/_framework/$wasm_path" >/dev/null
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: artifacts/site/wwwroot

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
